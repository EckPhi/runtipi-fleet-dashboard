[package]
name = "runtipi-fleet-dashboard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Collect Runtipi companion inventories and render Homepage configuration"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.40", features = ["fs", "macros", "rt-multi-thread", "signal", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
uuid = "=1.11.1"

[dev-dependencies]
axum = "0.8"
tempfile = "3.13"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
